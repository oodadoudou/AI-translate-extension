  <text x="32" y="124" font-size="13" fill="#111">第二段翻译，从缓存命中，0 tokens…</text>
  <!-- Item 3 -->
  <text x="32" y="150" font-size="11" fill="#bbb">15 分钟前 · 220 tokens</text>
  <text x="32" y="168" font-size="13" fill="#111">第三段翻译内容，本次共消耗…</text>
  <!-- Footer -->
  <line x1="20" y1="188" x2="300" y2="188" stroke="#f0f0f0" stroke-width="1"/>
  <text x="32" y="208" font-size="11" fill="#bbb">本页共消耗 400 tokens</text>
  <text x="278" y="208" font-size="11" fill="#bbb" text-anchor="end">清除</text>
</svg>