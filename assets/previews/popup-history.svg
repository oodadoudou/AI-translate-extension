  <line x1="20" y1="46" x2="300" y2="46" stroke="#f0f0f0" stroke-width="1"/>
  <text x="32" y="36" font-size="13" fill="#111" font-weight="700">本页历史 (3)</text>
  <text x="281" y="36" font-size="11" fill="#bbb">✕</text>
  <!-- Item 1 -->
  <line x1="20" y1="90" x2="300" y2="90" stroke="#f8f8f8" stroke-width="1"/>
  <text x="32" y="60" font-size="11" fill="#bbb">2 分钟前 · 180 tokens</text>
  <text x="32" y="78" font-size="13" fill="#111">这是第一段的翻译结果，点击可重新展示…</text>
  <!-- Item 2 -->
  <rect x="20" y="90" width="280" height="44" fill="#fafafa"/>
  <line x1="20" y1="134" x2="300" y2="134" stroke="#f8f8f8" stroke-width="1"/>
