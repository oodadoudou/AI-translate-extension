<svg width="320" height="200" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">
  <!-- Shadow -->
  <filter id="shadow">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.10)"/>
  </filter>
  <!-- Caret -->
  <rect x="152" y="8" width="12" height="12" fill="white" stroke="#111" stroke-width="1.5"
        transform="rotate(45 158 14)" filter="url(#shadow)"/>
  <!-- Card -->
  <rect x="20" y="16" width="280" height="172" rx="8" fill="white" stroke="#111" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Toolbar -->
  <line x1="20" y1="44" x2="300" y2="44" stroke="#f0f0f0" stroke-width="1"/>
  <!-- Lang label -->
  <text x="32" y="34" font-size="11" fill="#888">Simplified Chinese</text>
  <!-- Token badge -->
  <text x="157" y="34" font-size="10" fill="#111" font-weight="600">86 tokens</text>
  <!-- Pin icon -->
  <text x="245" y="34" font-size="13" fill="#bbb">⊙</text>
  <!-- History icon -->
  <text x="263" y="34" font-size="13" fill="#bbb">⟳</text>
  <!-- Close icon -->
  <text x="281" y="34" font-size="11" fill="#bbb">✕</text>
  <!-- Body text -->
  <text x="32" y="64" font-size="15" fill="#111">这是翻译结果的第一行文字，</text>
  <text x="32" y="86" font-size="15" fill="#111">内容清晰，排版简洁。</text>
  <text x="32" y="108" font-size="15" fill="#111">支持长段落滚动阅读。</text>
  <!-- Footer -->
  <line x1="20" y1="152" x2="300" y2="152" stroke="#f0f0f0" stroke-width="1"/>
  <text x="32" y="170" font-size="11" fill="#ccc"></text>
  <!-- Copy button -->
  <rect x="248" y="156" width="40" height="24" rx="5" fill="#111"/>
  <text x="268" y="173" font-size="12" fill="white" font-weight="600" text-anchor="middle">Copy</text>
</svg>